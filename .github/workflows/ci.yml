name: Verify Hitoiki Fullscreen Edition
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: tamago2-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run test:unit
      - run: npm run build
      - name: Validate only public assets are deployed
        run: |
          npx wrangler deploy --dry-run
          test "$(find dist -type f | wc -l)" -eq 10
      - run: npx playwright install --with-deps chromium webkit
      - name: Japanese screenshot fonts
        run: sudo apt-get install -y fonts-noto-cjk
      - name: Local browser tests
        run: npm test
      - name: Keep local screenshots and report
        if: always()
        run: |
          mkdir -p verification-local
          cp -r test-results playwright-report verification-local/ || true
      - name: Verify Cloudflare serves the tested main commit
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npm run verify:live
      - name: Test real deployed UI
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          BASE_URL: https://tamago2.itisnowornever271.workers.dev
        run: npx playwright test --grep '@live'
      - name: Prepare inspectable source bundle
        if: always()
        run: |
          mkdir -p test-results/source
          cp index.html app.js engine.js journey.js sprites.js styles.css fullscreen.css package.json wrangler.jsonc test-results/source/
          cp -r scripts tests test-results/source/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hitoiki-verification
          path: |
            test-results/
            playwright-report/
            verification-local/
            dist/
          retention-days: 14
