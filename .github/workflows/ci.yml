name: Verify Hitoiki Catalog and Face
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: tamago2-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: Actual sprites, expressions, meals, sleep and ten evolution looks
        run: npm run test:character
      - name: Full catalog, no lost captures, offline retry and pixel eye alignment
        run: npm run test:catalog
      - name: Existing 62-case developer lab and saved-data regression tests
        run: npm run test:lab
      - name: Validate deployment build
        run: npx wrangler deploy --dry-run
      - name: Match actual production files and artwork
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npm run verify:live
      - name: Actual production character and developer tests
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          BASE_URL: https://tamago2.itisnowornever271.workers.dev
        run: |
          npm run test:catalog
          npm run test:character
          npm run test:lab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hitoiki-catalog-face-verification
          path: |
            dist/
            verification/
            assets/
            features/
            qa/
            art/mame/build.py
            scripts/install-character.mjs
            scripts/check-character.mjs
            scripts/check-lab.mjs
            scripts/check-catalog.mjs
            scripts/install-catalog.mjs
            docs/catalog-diagnosis.md
          retention-days: 14
