name: Verify Hitoiki Renderer Hotfix
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: tamago2-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - run: npm test
      - name: Install browsers for actual startup checks
        run: npx playwright install --with-deps chromium webkit
      - name: Japanese screenshot fonts
        run: sudo apt-get install -y fonts-noto-cjk
      - name: Check character, menus, care, reports and saved data
        run: npm run test:startup
      - name: Validate Cloudflare build
        run: npx wrangler deploy --dry-run
      - name: Verify fixed production files by SHA-256
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npm run verify:live
      - name: Check actual production startup and interactions
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          BASE_URL: https://tamago2.itisnowornever271.workers.dev
        run: npm run test:startup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hitoiki-renderer-verification
          path: |
            dist/
            verification/
          retention-days: 14
