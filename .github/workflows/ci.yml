name: Verify Hitoiki Autonomy Edition
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: tamago2-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - run: npm test
      - name: Validate Cloudflare build
        run: npx wrangler deploy --dry-run
      - name: Verify production updated
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          node --input-type=module <<'NODE'
          const url='https://tamago2.itisnowornever271.workers.dev/version.json';
          let last='';
          for(let i=1;i<=30;i++){
            try{
              const r=await fetch(url+'?t='+Date.now(),{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(8000)});
              const text=await r.text();
              if(r.ok){
                const v=JSON.parse(text);
                if(v.release==='hitoiki-life-20260921-02'){
                  console.log('LIVE_READY',v);
                  process.exit(0);
                }
                last='release='+v.release;
              } else last='HTTP '+r.status;
            }catch(e){last=e.message}
            console.log('waiting for production',i+'/30',last);
            await new Promise(r=>setTimeout(r,10000));
          }
          throw new Error('Production did not update: '+last);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hitoiki-autonomy-build
          path: dist/
          retention-days: 14
