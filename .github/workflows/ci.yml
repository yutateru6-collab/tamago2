name: Verify Hitoiki Developer Lab
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: tamago2-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: Actual controls, isolated self-test, speech and normal-data protection
        run: npm run test:lab
      - name: Validate deployment build
        run: npx wrangler deploy --dry-run
      - name: Match production files
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npm run verify:live
      - name: Actual production browser verification
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          BASE_URL: https://tamago2.itisnowornever271.workers.dev
        run: npm run test:lab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hitoiki-lab-verification
          path: |
            dist/
            verification/
            features/
            qa/
            scripts/install-lab.mjs
            scripts/check-lab.mjs
          retention-days: 14
