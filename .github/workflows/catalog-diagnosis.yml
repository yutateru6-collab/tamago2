name: Diagnose catalog image delivery
on:
  push:
    branches: [fix/catalog-images-face]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe actual production images and record source snapshot
        run: |
          mkdir -p diagnosis/live
          git archive HEAD > diagnosis/source.tar
          node --input-type=module <<'NODE'
          import {writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const base='https://tamago2.itisnowornever271.workers.dev/';
          const paths=['version.json','app.js','world.js','life.css','index.html','creatures/2.png','creatures/3.png','creatures/5.png','creatures/7.png','creatures/10.png','creatures/12.png'];
          const results=[];
          for(const p of paths){try{const r=await fetch(base+p+'?diagnosis='+Date.now(),{signal:AbortSignal.timeout(20000)});const b=Buffer.from(await r.arrayBuffer());await writeFile('diagnosis/live/'+p.replaceAll('/','-'),b);results.push({path:p,status:r.status,type:r.headers.get('content-type'),bytes:b.length,png:b.subarray(0,8).toString('hex')==='89504e470d0a1a0a',sha256:createHash('sha256').update(b).digest('hex')});}catch(e){results.push({path:p,error:e.message});}}
          await writeFile('diagnosis/results.json',JSON.stringify(results,null,2));console.log(JSON.stringify(results,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-diagnosis
          path: diagnosis/
          retention-days: 7
