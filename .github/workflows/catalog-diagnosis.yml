name: Generate corrected catalog and face assets
on:
  push:
    branches: [fix/catalog-images-face]
    paths: [art/mame/build.py, scripts/generate-catalog.py, .github/workflows/catalog-diagnosis.yml]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Load the pinned existing art tool
        run: |
          mkdir -p art/tools
          BASE=https://raw.githubusercontent.com/Gamezxz/pixel-art-studio/f8c246635c4621a6c2b427833149afdc3dc3c719
          curl --fail --location "$BASE/scripts/pixelstudio.py" -o art/tools/pixelstudio.py
          curl --fail --location "$BASE/LICENSE" -o art/tools/LICENSE
      - run: node preview-build.mjs
      - run: python art/mame/build.py
      - run: python scripts/generate-catalog.py
      - name: Commit only generated assets on the repair branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/mame-sheet.png assets/mame-sheet.json assets/catalog/
          if ! git diff --cached --quiet; then
            git commit -m 'Generate aligned-eye sprite atlas and verified catalog image variants'
            git push origin HEAD:fix/catalog-images-face
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corrected-catalog-face-assets
          path: |
            assets/
            art/mame/generated/
          retention-days: 7
