name: Deploy autonomy preview
on:
  push:
    branches: [autonomy-preview]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - name: Deploy separate preview worker when token exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "No GitHub Cloudflare token; direct deploy skipped."
            exit 0
          fi
          npx wrangler deploy --name hitoiki-autonomy-preview
      - name: Probe Cloudflare branch preview
        run: |
          URL="https://autonomy-preview-tamago2.itisnowornever271.workers.dev/"
          echo "Checking $URL"
          for n in $(seq 1 12); do
            body="$(curl -LfsS --max-time 8 "$URL" 2>/dev/null || true)"
            if printf '%s' "$body" | grep -q 'hitoiki-life-20260921-02'; then
              echo "PREVIEW_READY=$URL"
              exit 0
            fi
            echo "not ready ($n/12)"
            sleep 10
          done
          echo "Cloudflare non-production branch preview is not enabled or not available."
